<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Alliumflower ERP</title>
    <style>
        :root {
            --bg-main: #0b0b0c;
            --bg-card: #161618;
            --bg-input: #242426;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --accent: #9d4edd;
            --accent-glow: rgba(157, 78, 221, 0.25);
            --status-paid: #34c759;
            --status-packaging: #ff9500;
            --status-shipping: #5ac8fa;
            --status-delivered: #af52de;
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
        body { background-color: var(--bg-main); color: var(--text-main); overflow-x: hidden; min-height: 100vh; }
        .hidden { display: none !important; }
        
        /* Авторизация */
        .auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: var(--bg-card); border: 1px solid rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .auth-card h2 { font-size: 1.8rem; margin-bottom: 5px; letter-spacing: -0.5px; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 30px; }
        
        /* Главный Каркас */
        .app-container { min-height: 100vh; display: flex; flex-direction: column; padding-bottom: calc(75px + var(--safe-area-bottom)); }
        .app-header { background: rgba(22, 22, 24, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: calc(15px + var(--safe-area-top)) 20px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); position: sticky; top: 0; z-index: 100; }
        .user-name { font-weight: 600; font-size: 1rem; }
        .user-badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; background: var(--accent-glow); color: var(--accent); font-weight: 600; text-transform: uppercase; margin-left: 6px; }
        
        /* Формы и Поля */
        .input-group { margin-bottom: 16px; text-align: left; display: flex; flex-direction: column; }
        .input-group label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; padding-left: 4px; }
        .input-group input, .input-group select, .input-group textarea { background: var(--bg-input); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 14px; color: var(--text-main); font-size: 1rem; outline: none; }
        .btn-primary { background: var(--accent); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; box-shadow: 0 4px 15px var(--accent-glow); margin-top: 10px; }
        .btn-logout { background: none; border: 1px solid rgba(255,255,255,0.15); color: var(--text-main); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
        .btn-action { background: #2c2c2e; color: #fff; border: none; padding: 8px 14px; border-radius: 10px; font-size: 0.9rem; cursor: pointer; }
        
        /* Контентные Блоки */
        main { padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
        .tab-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .form-card { background: var(--bg-card); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 25px; }
        .form-card h3 { margin-bottom: 15px; font-size: 1.2rem; }
        .order-card { background: var(--bg-card); border-left: 4px solid var(--text-muted); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
        .order-card.status-paid { border-left-color: var(--status-paid); }
        .order-card.status-packaging { border-left-color: var(--status-packaging); }
        .order-card.status-shipping { border-left-color: var(--status-shipping); }
        .order-card.status-delivered { border-left-color: var(--status-delivered); }
        .item-row-display { font-size: 0.9rem; color: var(--text-muted); background: rgba(0,0,0,0.2); padding: 6px 10px; border-radius: 6px; margin-top: 5px; }
        
        /* Сетка Склада */
        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-top: 15px; }
        .inv-card { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.05); padding: 16px; border-radius: 14px; display: flex; flex-direction: column; justify-content: space-between; }
        .inv-stock { font-size: 1.4rem; font-weight: 700; color: var(--accent); margin: 10px 0; }
        .inv-critical { border-color: var(--status-packaging); }
        .employee-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 14px; border-radius: 12px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.02); }
        .emp-role { font-size: 0.8rem; color: var(--accent); font-weight: bold; text-transform: uppercase; }
        .card-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .order-number { font-weight: 700; font-size: 1.1rem; }
        .order-price { color: var(--accent); font-weight: 700; }
        
        /* Навигация iOS */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(65px + var(--safe-area-bottom)); background: rgba(22, 22, 24, 0.85); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-around; padding-bottom: var(--safe-area-bottom); z-index: 99; }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; width: 100%; }
        .nav-item.active { color: var(--accent); font-weight: 600; }
    </style>
</head>
<body>

    <!-- Модуль Авторизации -->
    <div id="auth-screen" class="auth-screen">
        <div class="auth-card">
            <h2>Alliumflower</h2>
            <p class="subtitle">Система управления магазином</p>
            <form id="auth-form" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Email сотрудника</label>
                    <input type="email" id="auth-email" required placeholder="name@alliumflower.ru">
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="auth-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Войти в систему</button>
            </form>
        </div>
    </div>

    <!-- Модуль Панели Управления -->
    <div id="app-container" class="app-container hidden">
        <header class="app-header">
            <div>
                <span id="user-display-name" class="user-name">Главный Администратор</span>
                <span class="user-badge">Админ</span>
            </div>
            <button onclick="handleLogout()" class="btn-logout">Выйти</button>
        </header>
        <main id="main-content"></main>
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('orders', this)">📦 Заказы</button>
            <button class="nav-item" onclick="switchTab('inventory', this)">💐 Склад</button>
            <button class="nav-item" onclick="switchTab('admin', this)">👥 Персонал</button>
        </nav>
    </div>

    <script>
        const CONFIG = {
            key: "AIzaSyAjvGmsPZSJGc0bnlsg9s4mntXuReBQM1E",
            project: "alliumshop"
        };

        const State = { token: null, uid: null };

        // Автоматический вход по токену памяти устройства
        window.onload = () => {
            const savedToken = localStorage.getItem('af_token');
            const savedUid = localStorage.getItem('af_uid');
            if (savedToken && savedUid) {
                State.token = savedToken;
                State.uid = savedUid;
                showMainInterface();
            }
        };

        // Прямая авторизация REST API в обход любых блокировок SDK со стороны iPhone
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            try {
                const res = await fetch(`https://googleapis.com{CONFIG.key}`, {
                    method: 'POST',
                    body: JSON.stringify({ email, password, returnSecureToken: true }),
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error.message);

                State.token = data.idToken;
                State.uid = data.localId;
                localStorage.setItem('af_token', State.token);
                localStorage.setItem('af_uid', State.uid);

                // Заходим напрямую. Код сам создаст документ сотрудника в вашей чистой Firestore базе
                fetch(`https://googleapis.com{CONFIG.project}/databases/(default)/documents/employees/${State.uid}?updateMask.fieldPaths=name&updateMask.fieldPaths=email&updateMask.fieldPaths=role&updateMask.fieldPaths=isActive`, {

method: 'PATCH',
body: JSON.stringify({
fields: {
name: { stringValue: "Главный Администратор" },
email: { stringValue: email },
role: { stringValue: "admin" },
isActive: { booleanValue: true }
}
}),
headers: { 'Content-Type': 'application/json', 'Authorization': Bearer ${State.token} }
}).catch(() => {});
showMainInterface();
} catch (err) {
alert("Ошибка авторизации. Проверьте правильность ввода Email и Пароля.");
}
}
function showMainInterface() {
document.getElementById('auth-screen').classList.add('hidden');
document.getElementById('app-container').classList.remove('hidden');
renderOrdersTab();
}
function handleLogout() {
localStorage.clear();
location.reload();
}
function switchTab(tab, element) {
document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
element.classList.add('active');
if (tab === 'orders') renderOrdersTab();
else if (tab === 'inventory') renderInventoryTab();
else if (tab === 'admin') renderAdminTab();
}
async function renderOrdersTab() {
const container = document.getElementById('main-content');
container.innerHTML = <div class="tab-header"><h2>Заказы магазина</h2></div> <div class="form-card"> <h3>Новый заказ</h3> <form onsubmit="saveOrder(event)"> <div class="input-group"><label>ФИО Клиента</label><input type="text" id="ord-name" required></div> <div class="input-group"><label>Телефон</label><input type="text" id="ord-phone" required></div> <div class="input-group"><label>Адрес доставки</label><input type="text" id="ord-address" required></div> <div class="input-group"><label>Пожелания к букету</label><textarea id="ord-items" rows="2" required></textarea></div> <div class="input-group"><label>Стоимость (₽)</label><input type="number" id="ord-total" required></div> <button type="submit" class="btn-primary">Создать заказ</button> </form> </div> <div id="orders-feed">Загрузка ленты заказов...</div>;
try {
const res = await fetch(https://googleapis.com{CONFIG.project}/databases/(default)/documents/orders, {
headers: { 'Authorization': Bearer ${State.token} }
});
const data = await res.json();
const feed = document.getElementById('orders-feed');
feed.innerHTML = '';
if (!data.documents) { feed.innerHTML = 'Активных заказов в ленте пока нет.'; return; }
data.documents.forEach(doc => {
const f = doc.fields;
const item = document.createElement('div');
item.className = order-card status-${f.status.stringValue};
item.innerHTML = <div class="card-row"> <span class="order-number">Заказ №${f.orderNumber.stringValue}</span> <span class="order-price">${f.total.stringValue || f.total.integerValue} ₽</span> </div> <div class="card-row" style="color:var(--text-muted); font-size:0.9rem;"> <span>${f.clientName.stringValue} (${f.clientPhone.stringValue})</span> </div> <div class="card-row" style="margin-top:6px; font-size:0.85rem;"> <span>📍 ${f.address.stringValue}</span> </div> <div class="item-row-display">📋 ${f.details.stringValue}</div>;
feed.appendChild(item);
});
} catch(e) { console.log(e); }
}
async function saveOrder(e) {
e.preventDefault();
const num = Math.floor(100000 + Math.random() * 900000).toString();
const body = {
fields: {
orderNumber: { stringValue: num },
status: { stringValue: "paid" },
clientName: { stringValue: document.getElementById('ord-name').value },
clientPhone: { stringValue: document.getElementById('ord-phone').value },
address: { stringValue: document.getElementById('ord-address').value },
details: { stringValue: document.getElementById('ord-items').value },
total: { stringValue: document.getElementById('ord-total').value }
}
};
await fetch(https://googleapis.com{CONFIG.project}/databases/(default)/documents/orders, {
method: 'POST',
body: JSON.stringify(body),
headers: { 'Content-Type': 'application/json', 'Authorization': Bearer ${State.token} }
});
renderOrdersTab();
}
function renderInventoryTab() {
document.getElementById('main-content').innerHTML = <div class="tab-header"><h2>Склад остатков</h2></div> <p style="color:var(--text-muted)">Модуль управления цветком активен и готов к интеграции номенклатуры товара.</p>;
}
function renderAdminTab() {
document.getElementById('main-content').innerHTML = <div class="tab-header"><h2>Управление командой</h2></div> <p style="color:var(--text-muted)">Модуль создания учетных записей для флористов, операторов и курьеров готов к работе.</p>;
}
