<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Alliumflower</title>
<style>
:root{color-scheme:dark;--bg:#000;--card:#1c1c1e;--c2:#2c2c2e;--ink:#fff;--mut:#98989f;--line:#38383a;--ac:#a98bf0;--on:#120a22;--ok:#32d74b;--warn:#ff9f0a;--bad:#ff6961;--glass:rgba(28,28,30,.72)}
:root[data-t=light]{color-scheme:light;--bg:#f2f2f7;--card:#fff;--c2:#ececf1;--ink:#000;--mut:#6c6c70;--line:#d1d1d6;--ac:#7b55d6;--on:#fff;--ok:#248a3d;--warn:#b25000;--bad:#d70015;--glass:rgba(255,255,255,.75)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}main{max-width:760px;margin:auto;padding:14px max(16px,env(safe-area-inset-left))}
h1{font-size:30px;letter-spacing:-.6px;margin:6px 0 2px}h2{font-size:14px;font-weight:600;color:var(--mut);margin:22px 4px 8px}.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border-radius:20px;padding:15px;margin:10px 0;box-shadow:0 6px 24px rgba(0,0,0,.18)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row>*{min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{background:var(--card);border-radius:18px;padding:12px}.tile b{display:block;font-size:22px}.tile span{font-size:12px;color:var(--mut)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--ac)}.pill.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}.pill.bad{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.btn{border:0;border-radius:14px;padding:12px 16px;min-height:46px;background:var(--ac);color:var(--on);font-weight:600;cursor:pointer}.btn.g{background:var(--c2);color:var(--ink)}.btn.r{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}.btn.s{min-height:38px;padding:8px 13px;font-size:14px}.btn:disabled{opacity:.5}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.acts .btn{flex:1;min-width:110px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 2px 5px}input,select,textarea{width:100%;min-height:46px;padding:11px 13px;border-radius:13px;border:0;background:var(--c2)}textarea{min-height:70px}
.chips{display:flex;gap:7px;overflow-x:auto;margin:10px 0;padding-bottom:2px}.chip{flex:none;border:0;border-radius:99px;padding:8px 15px;background:var(--card);color:var(--mut);font-size:14px}.chip.on{background:var(--ac);color:var(--on);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:4px;overflow-x:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-top:1px solid var(--line)}
nav button{flex:1 0 auto;min-width:62px;border:0;background:none;border-radius:12px;padding:9px 1px;color:var(--mut);font-size:10.5px}nav button.on{background:var(--c2);color:var(--ac);font-weight:600}nav i{display:block;font-style:normal;font-size:20px}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:6;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:f .18s}.sh{background:var(--bg);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:u .22s}
@keyframes f{from{opacity:0}}@keyframes u{from{transform:translateY(30px);opacity:.4}}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;z-index:40;max-width:90%}
.ln{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.ln:last-child{border:0}.ln span:first-child{color:var(--mut)}
@media(min-width:900px){body{padding:0 0 0 230px}nav{top:0;right:auto;width:230px;flex-direction:column;justify-content:flex-start;padding:24px 12px;border-top:0;border-right:1px solid var(--line)}nav button{text-align:left;padding:13px 14px;font-size:15px}nav i{display:inline;margin-right:8px}.fab{bottom:28px}.ov{align-items:center}.sh{border-radius:26px}main{max-width:900px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<main id="v"><p class="mut">Подключение…</p></main><nav id="nav" hidden></nav><div id="m"></div><div id="toast" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
"use strict";
const cfg={apiKey:"AIzaSyAjvGmsPZSJGc0bnlsg9s4mntXuReBQM1E",authDomain:"alliumshop.firebaseapp.com",projectId:"alliumshop",storageBucket:"alliumshop.firebasestorage.app",messagingSenderId:"115056113788",appId:"1:115056113788:web:e228808cb564c9718671f9"};
firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.firestore(),TS=()=>firebase.firestore.FieldValue.serverTimestamp();
const $=i=>document.getElementById(i),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),M=n=>Math.round(+n||0).toLocaleString("ru-RU")+" ₸";
const ST=["Новый","Собирается","Готов","В пути","Выдан","Отменён"],RL={admin:"Администратор",operator:"Оператор",florist:"Флорист",courier:"Курьер"},SRC=["Instagram","WhatsApp","2ГИС","Телефон","Другое"],PAY=["Kaspi","Наличные","Перевод"];
let U=null,S=null,O=[],SF={},tab="home",fs="",fq="",subs=[],lock=false;
const today=()=>new Date().toLocaleDateString("sv-SE"),nm=id=>(SF[id]&&SF[id].name)||"Не назначен",mgr=()=>S&&["admin","operator"].includes(S.role),adm=()=>S&&S.role==="admin";
const gt=localStorage.getItem("t");if(gt)document.documentElement.dataset.t=gt;
function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3500)}
function modal(h){$("m").innerHTML=h?`<div class="ov" id="ov"><div class="sh">${h}</div></div>`:"";if(h)$("ov").onclick=e=>{if(e.target.id==="ov")modal("")}}
const ERR={"auth/invalid-credential":"Неверный email или пароль","auth/too-many-requests":"Слишком много попыток, подождите","auth/network-request-failed":"Нет интернета","auth/invalid-email":"Некорректный email","auth/user-disabled":"Учётная запись отключена","auth/email-already-in-use":"Этот email уже занят","auth/weak-password":"Пароль короче 6 символов","permission-denied":"Недостаточно прав"};
const er=e=>ERR[e.code]||("Ошибка: "+(e.code||e.message));
async function log(act,o,x){try{await db.collection("activityLogs").add({act,oid:o.id||"",name:o.bn||"",by:U.uid,byName:S.name||"",x:x||"",ts:TS()})}catch(e){}}
async function run(fn){if(lock)return;lock=true;try{await fn()}catch(e){toast(er(e))}finally{lock=false}}

function login(msg){subs.forEach(u=>u());subs=[];$("nav").hidden=true;$("v").innerHTML=`<div class="card" style="margin-top:12vh"><h1>Alliumflower</h1><p class="mut">Войдите рабочим аккаунтом. Аккаунты создаёт администратор.</p><form id="lf"><label>Email</label><input id="em" type="email" autocomplete="username" required><label>Пароль</label><input id="pw" type="password" autocomplete="current-password" required><div class="acts"><button class="btn">Войти</button></div></form><div class="acts"><button class="btn g s" id="rs">Забыли пароль?</button></div>${msg?`<p style="color:var(--bad)">${esc(msg)}</p>`:""}</div>`;
 $("lf").onsubmit=e=>{e.preventDefault();run(()=>auth.signInWithEmailAndPassword($("em").value.trim(),$("pw").value))};
 $("rs").onclick=()=>run(async()=>{const m=$("em").value.trim();if(!m)return toast("Введите email");await auth.sendPasswordResetEmail(m);toast("Письмо для сброса отправлено")})}

auth.onAuthStateChanged(async u=>{U=u;S=null;O=[];SF={};INV=[];BQ=[];CU={};SC=[];LD=[];EX=[];subs.forEach(f=>f());subs=[];if(!u)return login();
 try{const d=await db.collection("staff").doc(u.uid).get();const s=d.exists?d.data():null;
  if(!s||s.active!==true||!RL[s.role]){await auth.signOut();return login(!s?"Профиль сотрудника не создан. Обратитесь к администратору.":"Аккаунт отключён или роль не задана.")}
  S=s;
 }catch(e){await auth.signOut();return login("Не удалось проверить доступ: "+er(e))}
 subs.push(db.collection("staff").onSnapshot(s=>{SF={};s.forEach(d=>SF[d.id]=d.data());draw()},e=>toast(er(e))));
 const q=S.role==="courier"?db.collection("orders").where("courier","==",u.uid):db.collection("orders").orderBy("ts","desc").limit(300);
 subs.push(q.onSnapshot(s=>{O=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));draw()},e=>toast("Заказы: "+er(e))));
 if(["admin","florist"].includes(S.role)){subs.push(db.collection("inventory").onSnapshot(s=>{INV=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.cat||"").localeCompare(b.cat||"")||a.name.localeCompare(b.name));draw()},e=>toast("Склад: "+er(e))));subs.push(db.collection("bouquets").onSnapshot(s=>{BQ=s.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>toast("Букеты: "+er(e))))}
 if(mgr())subs.push(db.collection("customers").onSnapshot(s=>{CU={};s.forEach(d=>CU[d.id]=d.data());draw()},e=>toast("Клиенты: "+er(e))));
 if(["admin","operator","florist"].includes(S.role))subs.push(db.collection("showcase").onSnapshot(s=>{SC=s.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>toast("Витрина: "+er(e))));
 if(mgr())subs.push(db.collection("leads").onSnapshot(s=>{LD=s.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>toast("Заявки: "+er(e))));
 if(adm())subs.push(db.collection("expenses").onSnapshot(s=>{EX=s.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>toast("Расходы: "+er(e))));
 subs.push(db.collection("settings").doc("main").onSnapshot(d=>{SH=d.exists?d.data():{};applySet();draw()},e=>toast("Настройки: "+er(e))));
 tab="home";draw()});

function draw(){if(!S)return;const T=[["home","⌂","Главная"],["orders","☰","Заказы"]];if(["admin","florist"].includes(S.role))T.push(["stock","▦","Склад"]);if(["admin","operator","florist"].includes(S.role))T.push(["show","▤","Витрина"]);if(mgr())T.push(["crm","♥","Клиенты"],["leads","✉","Заявки"]);if(adm())T.push(["fin","₸","Финансы"]);if(adm())T.push(["team","☺","Команда"]);T.push(["me","⚙","Профиль"]);
 const n=$("nav");n.hidden=false;n.innerHTML=T.map(t=>`<button class="${tab===t[0]?"on":""}" data-t="${t[0]}"><i>${t[1]}</i>${t[2]}</button>`).join("");
 n.onclick=e=>{const b=e.target.closest("button");if(b){tab=b.dataset.t;draw();scrollTo(0,0)}};
 $("v").innerHTML=({home,orders,team,me,stock,show:vit,crm,leads,fin})[tab]()+(mgr()&&(tab==="home"||tab==="orders")?`<button class="btn fab" data-a="new">＋ Заказ</button>`:"");bind()}

function next(o){const s=+o.st;if(mgr())return s<4?[s===2&&!o.dv?4:s+1,["Начать сборку","Готов","Передать курьеру","Выдать","—"][s===2&&!o.dv?3:s]]:null;
 if(S.role==="florist"&&s<2)return[s+1,s?"Готов":"Начать сборку"];if(S.role==="courier"&&s===3)return[4,"Вручено"];return null}
const rest=o=>o.paid?0:Math.max(0,(+o.p||0)+(+o.fee||0)-(+o.pre||0));
function card(o){const n=next(o),c=+o.st===5?"bad":+o.st===4?"ok":"";
 return `<div class="card"><div class="row"><b>${esc(o.bn||"Заказ")}</b><span class="pill ${c}">${ST[+o.st]||"?"}</span></div>
 <div class="mut">${esc(o.client)} · ${esc(o.phone)}<br>${esc(o.date||"")} ${esc(o.time||"")} · ${o.dv?"Доставка: "+esc(o.addr)+(o.courier?" · "+esc(nm(o.courier)):""):"Самовывоз"}</div>
 <div class="row" style="margin-top:8px"><b>${M(+o.p+(+o.fee||0))}</b>${o.paid?'<span class="pill ok">Оплачен</span>':`<span class="pill warn">К оплате ${M(rest(o))}</span>`}</div>
 <div class="acts"><button class="btn g s" data-a="det" data-id="${o.id}">Подробнее</button>${n?`<button class="btn s" data-a="adv" data-id="${o.id}">${n[1]}</button>`:""}</div></div>`}

function home(){const act=O.filter(o=>+o.st<4),c=i=>O.filter(o=>+o.st===i).length,td=O.filter(o=>o.date===today()&&+o.st!==5);
 const money=td.reduce((a,o)=>a+(+o.p||0)+(+o.fee||0),0),up=O.filter(o=>+o.st<4).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,6);
 return `<h1>Здравствуйте, ${esc(S.name||"")}</h1><p class="mut">${esc(SH.name||"Alliumflower")} · ${RL[S.role]} · ${new Date().toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"})}</p>
 <div class="tiles" style="margin-top:14px"><div class="tile"><b>${c(0)}</b><span>Новые</span></div><div class="tile"><b>${c(1)}</b><span>В сборке</span></div><div class="tile"><b>${c(2)}</b><span>Готовы</span></div><div class="tile"><b>${c(3)}</b><span>В пути</span></div><div class="tile"><b>${c(4)}</b><span>Выданы</span></div><div class="tile"><b>${c(5)}</b><span>Отменены</span></div></div>
 ${mgr()?`<div class="g2" style="margin-top:8px"><div class="tile"><b>${M(money)}</b><span>Заказов на сегодня</span></div><div class="tile"><b>${act.filter(o=>!o.paid).length}</b><span>Неоплаченные</span></div></div>`:""}
 ${alerts()}<h2>Ближайшие</h2>${up.map(card).join("")||'<div class="card mut">Активных заказов нет.</div>'}`}

function orders(){const q=fq.toLowerCase(),l=O.filter(o=>(fs===""||String(o.st)===fs)&&(`${o.client} ${o.phone} ${o.bn}`).toLowerCase().includes(q));
 return `<h1>Заказы</h1><input id="q" placeholder="Поиск: имя, телефон, букет" value="${esc(fq)}"><div class="chips">${[["","Все"],...ST.map((s,i)=>[String(i),s])].map(c=>`<button class="chip ${fs===c[0]?"on":""}" data-a="f" data-id="${c[0]}">${c[1]}</button>`).join("")}</div>${l.map(card).join("")||'<div class="card mut">Ничего не найдено.</div>'}`}

function team(){return `<h1>Команда</h1><p class="mut">Здесь вы создаёте сотрудников, меняете роли и отключаете доступ.</p>
 <div class="card"><b>Новый сотрудник</b><form id="tf"><label>Имя</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Временный пароль (от 6 символов)</label><input name="pass" type="text" minlength="6" required><label>Роль</label><select name="role">${Object.keys(RL).map(r=>`<option value="${r}">${RL[r]}</option>`).join("")}</select><div class="acts"><button class="btn">Создать сотрудника</button></div></form></div>
 <h2>Сотрудники</h2>${Object.keys(SF).map(id=>{const s=SF[id],me=id===U.uid;return `<div class="card"><div class="row"><b>${esc(s.name)}</b><span class="pill ${s.active?"ok":"bad"}">${s.active?"Активен":"Отключён"}</span></div><div class="mut">${esc(s.email||"")}</div>${me?`<div class="mut">Это вы</div>`:`<div class="acts"><select data-a="role" data-id="${id}">${Object.keys(RL).map(r=>`<option value="${r}" ${s.role===r?"selected":""}>${RL[r]}</option>`).join("")}</select><button class="btn s ${s.active?"r":""}" data-a="act" data-id="${id}">${s.active?"Отключить":"Включить"}</button></div>`}</div>`}).join("")}`}

function me(){return `<h1>Профиль</h1><div class="card"><div class="row"><b>${esc(S.name)}</b><span class="pill">${RL[S.role]}</span></div><div class="mut">${esc(U.email)}</div></div>${adm()?setCard():""}${shopInfo()}
 <div class="card"><div class="row"><span>Тема</span><div class="acts" style="margin:0"><button class="btn g s" data-a="th" data-id="dark">Тёмная</button><button class="btn g s" data-a="th" data-id="light">Светлая</button></div></div></div>
 <div class="acts"><button class="btn g" data-a="pw">Сменить пароль по письму</button><button class="btn r" data-a="out">Выйти</button></div>`}

function form(o){const e=o&&o.id,v=o||{},cs=Object.keys(SF).filter(i=>SF[i].role==="courier"&&SF[i].active);
 modal(`<h1 style="font-size:24px">${e?"Изменить заказ":"Новый заказ"}</h1><form id="of"><div class="g2"><div><label>Клиент *</label><input name="client" required value="${esc(v.client)}"></div><div><label>Телефон *</label><input name="phone" type="tel" required value="${esc(v.phone||"+7")}"></div></div>
 <label>Букет *</label><input name="bn" required value="${esc(v.bn)}"><label>Состав</label><textarea name="comp">${esc(v.comp)}</textarea>
 <div class="g2"><div><label>Цена, ₸ *</label><input name="p" type="number" min="0" required value="${esc(v.p)}"></div><div><label>Предоплата, ₸</label><input name="pre" type="number" min="0" value="${esc(v.pre||0)}"></div></div>
 <div class="g2"><div><label>Дата *</label><input name="date" type="date" required value="${esc(v.date||today())}"></div><div><label>Время</label><input name="time" type="time" value="${esc(v.time)}"></div></div>
 <label>Получение</label><select name="dv"><option value="0">Самовывоз</option><option value="1" ${v.dv?"selected":""}>Доставка</option></select><label>Адрес доставки</label><input name="addr" value="${esc(v.addr)}">
 <div class="g2"><div><label>Доставка, ₸</label><input name="fee" type="number" min="0" value="${esc(v.fee||0)}"></div><div><label>Оплата курьеру, ₸</label><input name="cpay" type="number" min="0" value="${esc(v.cpay||0)}"></div></div>
 <label>Курьер</label><select name="courier"><option value="">Не назначен</option>${cs.map(i=>`<option value="${i}" ${v.courier===i?"selected":""}>${esc(SF[i].name)}</option>`).join("")}</select>
 <div class="g2"><div><label>Источник</label><select name="src">${SRC.map(s=>`<option ${v.src===s?"selected":""}>${s}</option>`).join("")}</select></div><div><label>Оплата</label><select name="pay">${PAY.map(s=>`<option ${v.pay===s?"selected":""}>${s}</option>`).join("")}</select></div></div>
 <label class="row" style="color:var(--ink)">Заказ полностью оплачен<input name="paid" type="checkbox" style="width:26px;min-height:26px" ${v.paid?"checked":""}></label>
 <label>Текст открытки</label><input name="card" value="${esc(v.card)}"><label>Комментарий</label><textarea name="note">${esc(v.note)}</textarea>
 <div class="acts"><button class="btn g" type="button" data-a="x">Закрыть</button><button class="btn">${e?"Сохранить":"Создать заказ"}</button></div></form>`);
 $("of").onsubmit=ev=>{ev.preventDefault();const f=new FormData($("of")),g=k=>(f.get(k)||"").toString().trim(),dv=g("dv")==="1";

 return `<h1>Витрина</h1><p class="mut">Готовые букеты. Выставить новый: Склад → Букеты → «На витрину».</p>`+(a.map(x=>{const d=vleft(x),m=x.price?Math.round((x.price-x.cost)/x.price*100):0;return `<div class="card"><div class="row"><b>${esc(x.name)}</b><b>${M(x.price)}</b></div><div class="mut">Собран ${esc(x.made)} · ${esc(x.byName)} · себестоимость ${M(x.cost)} · маржа ${m}%</div><span class="pill ${d<=0?"bad":d<=1?"warn":"ok"}">${d<=0?"Срок вышел":"Осталось дней: "+d}</span><div class="acts"><button class="btn s" data-a="v_sell" data-id="${x.id}">Продать</button>${mgr()?`<button class="btn g s" data-a="v_ord" data-id="${x.id}">В заказ</button>`:""}<button class="btn r s" data-a="v_wo" data-id="${x.id}">Списать</button></div></div>`}).join("")||'<div class="card mut">На витрине пусто.</div>')+(h.length?`<h2>История операций</h2><div class="card">${h.map(x=>`<div class="ln"><span>${esc(x.name)}</span><span>${T[x.st]||""} · ${new Date(x.at||0).toLocaleDateString("ru-RU")}${x.why?" · "+esc(x.why):""}</span></div>`).join("")}</div>`:"")}
async function scSet(id,st,x){await db.runTransaction(async t=>{const r=db.collection("showcase").doc(id),s=await t.get(r);if(!s.exists||s.data().st!=="in")throw{message:"букет уже убран с витрины"};t.update(r,{st,at:Date.now(),opBy:U.uid,opName:S.name,...x})})}
function toOrder(id){const x=SC.find(y=>y.id===id),l=O.filter(o=>+o.st<3);if(!l.length)return toast("Нет заказов, которые ещё не готовы");
 modal(hd("В заказ: "+esc(x.name))+`<form id="vf"><label>Заказ</label><select name="o">${l.map(o=>`<option value="${o.id}">${esc(o.client)} · ${esc(o.bn)} · ${esc(o.date)}</option>`).join("")}</select><p class="mut">Заказ получит статус «Готов».</p>${btns("Переместить")}</form>`);
 $("vf").onsubmit=e=>{e.preventDefault();const oid=new FormData($("vf")).get("o");run(async()=>{await db.runTransaction(async t=>{const r=db.collection("showcase").doc(id),s=await t.get(r);if(!s.exists||s.data().st!=="in")throw{message:"букет уже убран с витрины"};t.update(r,{st:"order",oid,at:Date.now(),opBy:U.uid,opName:S.name});t.update(db.collection("orders").doc(oid),{sc:id,st:2,updatedAt:TS(),statusBy:U.uid})});log("Букет с витрины в заказ",{id:oid,bn:x.name});modal("");toast("Букет перемещён в заказ")})}}
document.addEventListener("click",e=>{const b=e.target.closest('[data-a^="c_"],[data-a^="v_"]');if(!b||!S)return;const a=b.dataset.a,id=b.dataset.id,nmv=()=>({bn:(SC.find(x=>x.id===id)||{}).name});
 if(a==="c_cm")run(()=>addComm(id));else if(a==="c_d")cDetail(id);else if(a==="c_no"){const c=clients().find(x=>x.k===id);form({client:c.name,phone:c.phone})}
 else if(a==="v_sell"&&confirm("Отметить букет проданным?"))run(()=>scSet(id,"sold").then(()=>{log("Продан букет с витрины",nmv());toast("Продано")}));
 else if(a==="v_ord")toOrder(id);
 else if(a==="v_wo"){const w=prompt("Причина списания","Увял");if(w!==null)run(()=>scSet(id,"wo",{why:w.trim()}).then(()=>{log("Списан букет с витрины",nmv(),w);toast("Списано")}))}});
/* ===== Заявки, финансы, история общения ===== */
let LD=[],EX=[],PL=null,fp="m",fa="",fb="";
const LSN={new:"Новая",work:"В работе",done:"Заказ создан",lost:"Отказ"},ECAT=["Закупка цветов","Упаковка","Зарплата","Курьеры","Аренда","Прочее"];
function leads(){const l=LD.slice().sort((a,b)=>b.ts-a.ts);
 return `<h1>Заявки</h1><div class="acts"><button class="btn" data-a="l_new">＋ Заявка</button></div>`+(l.map(x=>`<div class="card"><div class="row"><b>${esc(x.name)}</b><span class="pill ${x.st==="done"?"ok":x.st==="lost"?"bad":""}">${LSN[x.st]}</span></div><div class="mut">${esc(x.src)} · ${esc(x.phone)}${x.want?" · "+esc(x.want):""}${x.budget?" · бюджет "+M(x.budget):""}<br>Ответственный: ${esc(nm(x.resp))}${x.note?"<br>"+esc(x.note):""}</div>${x.st==="new"||x.st==="work"?`<div class="acts">${x.st==="new"?`<button class="btn g s" data-a="l_w" data-id="${x.id}">Взять в работу</button>`:""}<button class="btn s" data-a="l_c" data-id="${x.id}">Создать заказ</button><button class="btn r s" data-a="l_x" data-id="${x.id}">Отказ</button></div>`:""}</div>`).join("")||'<div class="card mut">Заявок пока нет. Записывайте обращения из Instagram, WhatsApp, 2ГИС и звонков.</div>')}
function leadForm(){modal(hd("Новая заявка")+`<form id="lf2"><label>Источник</label><select name="src">${SRC.map(s=>`<option>${s}</option>`).join("")}</select><label>Имя *</label><input name="name" required><label>Телефон *</label><input name="phone" type="tel" required value="+7"><label>Желаемый букет</label><input name="want"><label>Бюджет, ₸</label><input name="budget" type="number" min="0"><label>Комментарий</label><textarea name="note"></textarea>${btns("Сохранить")}</form>`);
 $("lf2").onsubmit=e=>{e.preventDefault();const f=new FormData($("lf2")),g=k=>f.get(k).toString().trim();if(!/^\+?\d[\d\s()-]{9,}$/.test(g("phone")))return toast("Проверьте номер телефона");
  run(async()=>{await db.collection("leads").add({src:g("src"),name:g("name"),phone:g("phone"),want:g("want"),budget:+g("budget")||0,note:g("note"),st:"new",resp:"",by:U.uid,ts:Date.now()});modal("");toast("Заявка сохранена")})}}
function range(){const d=new Date(),f=x=>x.toLocaleDateString("sv-SE");let a=f(d),b=a;if(fp==="w"){const s=new Date(d);s.setDate(d.getDate()-6);a=f(s)}else if(fp==="m")a=f(new Date(d.getFullYear(),d.getMonth(),1));else if(fp==="y")a=d.getFullYear()+"-01-01";else if(fp==="c"){a=fa||a;b=fb||b}return[a,b]}
function fin(){const[a,b]=range(),In=x=>x>=a&&x<=b,tot=o=>(+o.p||0)+(+o.fee||0),os=O.filter(o=>+o.st!==5&&In(o.date||"")),sold=SC.filter(x=>x.st==="sold"&&In(new Date(x.at).toLocaleDateString("sv-SE")));
 const rev=os.reduce((s,o)=>s+(o.paid?tot(o):+o.pre||0),0)+sold.reduce((s,x)=>s+(+x.price||0),0),cost=os.filter(o=>o.paid).reduce((s,o)=>{const q=BQ.find(z=>z.name===o.bn);return s+(q?bcost(q):0)},0)+sold.reduce((s,x)=>s+(+x.cost||0),0);
 const ex=EX.filter(x=>In(x.date)),pur=ex.filter(x=>["Закупка цветов","Упаковка"].includes(x.cat)).reduce((s,x)=>s+x.sum,0),opx=ex.reduce((s,x)=>s+x.sum,0)-pur,cur=os.filter(o=>+o.st===4&&o.dv).reduce((s,o)=>s+(+o.cpay||0),0);
 const gross=rev-cost,net=gross-opx-cur,un=O.filter(o=>+o.st!==5&&!o.paid),n=os.length+sold.length,avg=n?(os.reduce((s,o)=>s+tot(o),0)+sold.reduce((s,x)=>s+(+x.price||0),0))/n:0,L=(x,y)=>`<div class="ln"><span>${x}</span><b>${y}</b></div>`;
 return `<h1>Финансы</h1><div class="chips">${[["d","День"],["w","7 дней"],["m","Месяц"],["y","Год"],["c","Период"]].map(c=>`<button class="chip ${fp===c[0]?"on":""}" data-a="f_p" data-id="${c[0]}">${c[1]}</button>`).join("")}</div>${fp==="c"?`<div class="g2"><input type="date" data-a="f_d" id="fa" value="${fa}"><input type="date" data-a="f_d" id="fb" value="${fb}"></div>`:""}
 <div class="card">${L("Выручка (полученные деньги)",M(rev))}${L("Себестоимость оплаченных",M(cost))}${L("Валовая прибыль",M(gross))}${L("Расходы",M(opx))}${L("Оплата курьерам",M(cur))}${L("Чистая прибыль",M(net))}${L("Маржинальность",rev?Math.round(gross/rev*100)+"%":"—")}${L("Средний чек",M(avg))}${L("Заказов и продаж",n)}</div>
 <div class="card">${L("Долги клиентов",M(un.reduce((s,o)=>s+rest(o),0)))}${L("Неоплаченных заказов",un.length)}${L("Закупки за период (в расходы не входят)",M(pur))}</div><p class="mut">Закупки цветов и упаковки уже учтены через себестоимость при списании, поэтому в расходы не входят. Отменённые заказы в выручку не попадают. Себестоимость берётся из рецепта букета с тем же названием.</p>
 <div class="row"><h2>Расходы за период</h2><button class="btn s" data-a="f_n">＋ Расход</button></div><div class="card">${ex.sort((x,y)=>y.ts-x.ts).map(x=>`<div class="ln"><span>${esc(x.date)} · ${esc(x.cat)}${x.note?" · "+esc(x.note):""}</span><span>${M(x.sum)} <a href="#" data-a="f_x" data-id="${x.id}" style="color:var(--bad)">убрать</a></span></div>`).join("")||'<span class="mut">Расходов нет</span>'}</div>`}
function exForm(){modal(hd("Новый расход")+`<form id="ef"><label>Категория</label><select name="cat">${ECAT.map(c=>`<option>${c}</option>`).join("")}</select><div class="g2"><div><label>Сумма, ₸ *</label><input name="sum" type="number" min="1" required></div><div><label>Дата</label><input name="date" type="date" value="${today()}" required></div></div><label>Комментарий</label><input name="note">${btns("Сохранить")}</form>`);
 $("ef").onsubmit=e=>{e.preventDefault();const f=new FormData($("ef"));run(async()=>{await db.collection("expenses").add({cat:f.get("cat"),sum:+f.get("sum"),date:f.get("date"),note:f.get("note").toString().trim(),by:U.uid,byName:S.name,ts:Date.now()});modal("");toast("Расход записан")})}}
function comms(c){const l=((c.x||{}).comms||[]).slice().reverse();return `<h2>История общения</h2><div class="card">${l.map(x=>`<div class="ln"><span>${new Date(x.ts).toLocaleDateString("ru-RU")} · ${esc(x.ch)} · ${esc(x.who)}</span><span style="text-align:right">${esc(x.t)}</span></div>`).join("")||'<span class="mut">Записей пока нет</span>'}<select id="cmc" style="margin-top:10px">${["WhatsApp","Звонок","Instagram","Лично"].map(s=>`<option>${s}</option>`).join("")}</select><input id="cmt" placeholder="О чём договорились" style="margin-top:8px"><div class="acts"><button class="btn g s" data-a="c_cm" data-id="${c.k}">Записать</button></div></div>`}
async function addComm(k){const t=$("cmt").value.trim();if(!t)return toast("Напишите, о чём говорили");const c=clients().find(x=>x.k===k),en={ch:$("cmc").value,t,who:S.name,ts:Date.now()};
 await db.collection("customers").doc(k).set({phone:c.phone,comms:firebase.firestore.FieldValue.arrayUnion(en)},{merge:true});CU[k]={...(CU[k]||{}),name:(CU[k]||{}).name||c.name,phone:c.phone,comms:[...((CU[k]||{}).comms||[]),en]};cDetail(k)}
document.addEventListener("click",e=>{const b=e.target.closest('[data-a^="l_"],[data-a^="f_"]');if(!b||!S)return;const a=b.dataset.a,id=b.dataset.id,x=LD.find(y=>y.id===id);if(a==="f_x")e.preventDefault();
 if(a==="l_new")leadForm();else if(a==="l_w")run(async()=>{await db.collection("leads").doc(id).update({st:"work",resp:U.uid})});
 else if(a==="l_c"){PL={id,phone:x.phone};form({client:x.name,phone:x.phone,bn:x.want,p:x.budget||"",src:x.src,note:x.note})}
 else if(a==="l_x"&&confirm("Отметить заявку как отказ?"))run(async()=>{await db.collection("leads").doc(id).update({st:"lost"})});
 else if(a==="f_p"){fp=id;draw()}else if(a==="f_n")exForm();else if(a==="f_x"&&confirm("Убрать расход?"))run(async()=>{await db.collection("expenses").doc(id).delete();log("Удалён расход",{bn:""})})});
document.addEventListener("change",e=>{const i=e.target.closest('[data-a="f_d"]');if(i&&S){if(i.id==="fa")fa=i.value;else fb=i.value;draw()}});

let SH={};
function applySet(){const r=document.documentElement.style;document.title=SH.name||"Alliumflower";if(/^#[0-9a-f]{6}$/i.test(SH.accent||""))r.setProperty("--ac",SH.accent);else r.removeProperty("--ac")}
function setCard(){return `<h2>Настройки магазина</h2><form id="sf" class="card"><label>Название</label><input name="name" value="${esc(SH.name||"Alliumflower")}"><label>Телефон</label><input name="phone" type="tel" value="${esc(SH.phone)}"><label>Адрес</label><input name="addr" value="${esc(SH.addr)}"><label>График работы</label><input name="hours" value="${esc(SH.hours)}" placeholder="Ежедневно 09:00–21:00"><label>Цвет акцента</label><input name="accent" type="color" value="${esc(SH.accent||"#a98bf0")}"><p class="mut">Валюта: тенге (₸). Цвет и название увидят все сотрудники.</p><div class="acts"><button class="btn">Сохранить настройки</button></div></form>`}
function shopInfo(){return !adm()&&(SH.phone||SH.addr||SH.hours)?`<div class="card"><b>${esc(SH.name||"")}</b><div class="mut">${esc(SH.phone)}<br>${esc(SH.addr)}<br>${esc(SH.hours)}</div></div>`:""}
function saveSet(e){e.preventDefault();const f=new FormData($("sf")),g=k=>(f.get(k)||"").toString().trim();run(async()=>{await db.collection("settings").doc("main").set({name:g("name")||"Alliumflower",phone:g("phone"),addr:g("addr"),hours:g("hours"),accent:g("accent"),cur:"KZT",updatedAt:TS()},{merge:true});log("Изменены настройки",{bn:""});toast("Настройки сохранены")})}
function alerts(){const now=Date.now(),a=[],c=(n,t,k)=>{if(n)a.push([n,t,k||""])};
 if(S.role==="courier")c(O.filter(o=>+o.st===3).length,"доставок в пути у вас");
 else{c(O.filter(o=>+o.st===0).length,"новых заказов");c(O.filter(o=>+o.st===2).length,"заказов готово: выдать или передать курьеру");c(O.filter(o=>o.dv&&+o.st<4&&o.date&&new Date(o.date+"T"+(o.time||"23:59")).getTime()<now).length,"доставок просрочено","bad")}
 if(mgr())c(O.filter(o=>+o.st>=2&&+o.st<5&&!o.paid).length,"заказов готово, но не оплачено","warn");
 if(["admin","florist"].includes(S.role))c(INV.filter(i=>i.qty<=(+i.min||0)).length,"позиций на складе заканчивается","warn");
 return a.length?`<h2>Уведомления</h2><div class="card">${a.map(x=>`<div class="ln"><span class="pill ${x[2]}">${x[0]}</span><span>${x[1]}</span></div>`).join("")}</div>`:""}
