    <style>
        :root {

            --text-main: #ffffff;

        .user-name { font-weight: 600; font-size: 1rem; }
        .user-badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; background: var(--accent-glow); color: var(--accent); font-weight: 600; text-transform: uppercase; margin-left: 6px; }

        .input-group { margin-bottom: 16px; text-align: left; display: flex; flex-direction: column; }
        .input-group label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; padding-left: 4px; }
        .input-group input, .input-group select, .input-group textarea { background: var(--bg-input); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 14px; color: var(--text-main); font-size: 1rem; outline: none; }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: var(--accent); }

        .btn-primary { background: var(--accent); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; box-shadow: 0 4px 15px var(--accent-glow); margin-top: 10px; }
        .btn-logout { background: none; border: 1px solid rgba(255,255,255,0.15); color: var(--text-main); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
        .btn-action { background: #2c2c2e; color: #fff; border: none; padding: 8px 14px; border-radius: 10px; font-size: 0.9rem; cursor: pointer; }
        .btn-link { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.85rem; margin-top: 15px; text-decoration: underline; display: block; width: 100%; text-align: center; }

        main { padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
        .tab-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .form-card { background: var(--bg-card); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 25px; }
        .form-card h3 { margin-bottom: 15px; font-size: 1.2rem; }

        .order-card { background: var(--bg-card); border-left: 4px solid var(--text-muted); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
        .order-card.status-paid { border-left-color: var(--status-paid); }
        .order-card.status-packaging { border-left-color: var(--status-packaging); }
        .order-card.status-shipping { border-left-color: var(--status-shipping); }
        .order-card.status-delivered { border-left-color: var(--status-delivered); }

    <script>
        const AppState = { currentUser: null, currentRole: null, activeTab: 'orders' };

        // Слушатель авторизации (Синхронизирован с автоматической коллекцией employees)
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const doc = await db.collection('employees').doc(user.uid).get();
                    if (doc.exists && doc.data().isActive) {
                        AppState.currentUser = doc.data();
                        AppState.currentRole = doc.data().role;
                        initInterface();
                    } else {
alert('Доступ заблокирован. Вас нет в базе данных сотрудников.');
auth.signOut();
}
} catch (e) {
alert('Ошибка верификации аккаунта: ' + e.message);
auth.signOut();
}
} else {
document.getElementById('app-container').classList.add('hidden');
document.getElementById('auth-screen').classList.remove('hidden');
}
});
// Форма входа
document.getElementById('auth-form').addEventListener('submit', (e) => {
e.preventDefault();
const email = document.getElementById('auth-email').value;
const password = document.getElementById('auth-password').value;
auth.signInWithEmailAndPassword(email, password).catch(err => alert('Ошибка входа: ' + err.message));
});
// Кнопка автосоздания правильного админа в чистую базу данных
document.getElementById('btn-auto-admin').addEventListener('click', async () => {
const email = "nash0082008@icloud.com";
const pass = "2020Mansur";
try {
const cred = await auth.createUserWithEmailAndPassword(email, pass);
await db.collection('employees').doc(cred.user.uid).set({
name: "Главный Администратор",
email: email,
role: "admin",
isActive: true,

});

} catch(err) {
if (err.code === "auth/email-already-in-use") {
// Если в Authentication юзер остался, просто заново пишем документ в чистый Firestore
const user = auth.currentUser || (await auth.signInWithEmailAndPassword(email, pass)).user;
await db.collection('employees').doc(user.uid).set({
name: "Главный Администратор",
email: email,
role: "admin",
isActive: true,
createdAt: new Date().toISOString()
});
alert("Профиль восстановлен в базе данных! Вводите логин и пароль.");
} else {
alert("Ошибка: " + err.message);
}
}
});
document.getElementById('btn-logout').addEventListener('click', () => auth.signOut());
document.querySelectorAll('.nav-item').forEach(btn => {
btn.addEventListener('click', (e) => {
document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
e.currentTarget.classList.add('active');
AppState.activeTab = e.currentTarget.dataset.target;
switchTab(AppState.activeTab);
});
});
function initInterface() {
document.getElementById('auth-screen').classList.add('hidden');
document.getElementById('app-container').classList.remove('hidden');
document.getElementById('user-display-name').textContent = AppState.currentUser.name;
document.getElementById('user-display-role').textContent = translateRole(AppState.currentRole);
if (AppState.currentRole !== 'admin') document.getElementById('nav-admin').classList.add('hidden');
if (AppState.currentRole === 'courier') document.getElementById('nav-inventory').classList.add('hidden');
switchTab(AppState.activeTab);
}
function translateRole(role) {
const roles = { admin: "Админ", operator: "Оператор", florist: "Флорист", courier: "Курьер" };
return roles[role] || role;
}

function translateStatusName(st) {
const list = { paid: "Оплачен", packaging: "Сборка букета", shipping: "Доставляется", delivered: "Доставлен" };
return list[st] || st;
}
async function createOrder(e) {
e.preventDefault();
const num = Math.floor(100000 + Math.random() * 900000).toString();
try {
await db.collection('orders').add({
orderNumber: num,
status: "paid",
customer: {
name: document.getElementById('ord-name').value,
phone: document.getElementById('ord-phone').value,
address: document.getElementById('ord-address').value
},
details: document.getElementById('ord-items').value,
financials: { total: parseFloat(document.getElementById('ord-total').value) },
timestamps: { created: new Date().toISOString() }
});
document.getElementById('order-form').reset();
} catch(err) { alert("Ошибка создания заказа: " + err.message); }
}
async function createInventoryItem(e) {
e.preventDefault();
const name = document.getElementById('inv-title').value;
const count = parseInt(document.getElementById('inv-count').value);
const min = parseInt(document.getElementById('inv-min').value);
try {
await db.collection('inventory').add({
name: name,
quantity: count,
minAlert: min
});
document.getElementById('inv-form').reset();
} catch(err) { alert(err.message); }
}
function changeStock(id, diff) {
db.collection('inventory').doc(id).get().then(doc => {
if(doc.exists) {
let newQty = (doc.data().quantity || 0) + diff;
if(newQty < 0) newQty = 0;
db.collection('inventory').doc(id).update({ quantity: newQty });
}
});
}
async function createEmployee(e) {
e.preventDefault();
const name = document.getElementById('emp-name').value;
const email = document.getElementById('emp-email').value;
const pass = document.getElementById('emp-pass').value;
const role = document.getElementById('emp-role').value;
const secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary");
try {
const cred = await secondaryApp.auth().createUserWithEmailAndPassword(email, pass);
await db.collection('employees').doc(cred.user.uid).set({
name: name,
email: email,
role: role,
isActive: true,
createdAt: new Date().toISOString()
});
alert(Сотрудник ${name} добавлен в систему.);
document.getElementById('employee-form').reset();
} catch(err) { alert("Ошибка: " + err.message); }
await secondaryApp.delete();
}
function updateOrderStatus(id, newStatus) {
db.collection('orders').doc(id).update({ status: newStatus }).catch(e => alert(e.message));
}
function toggleEmployeeStatus(id, newStatus) {
db.collection('employees').doc(id).update({ isActive: newStatus }).catch(e => alert(e.message));
}
